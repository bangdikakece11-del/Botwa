<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlowRampas - Admin Database</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/9ZbX7yY.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{
            color:#e2e8f0;
            min-height:100vh;
            padding:20px;
            transition: background 0.5s ease;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://i.imgur.com/6bFzQkH.jpg') center/cover no-repeat fixed;
        }
        body.panel-bg{
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)), url('https://i.imgur.com/8dR7sXj.jpg') center/cover no-repeat fixed;
        }
        .container{max-width:800px;margin:0 auto;background:rgba(30, 41, 59, 0.92);border-radius:16px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,0.6);backdrop-filter: blur(8px)}
        .header{text-align:center;margin-bottom:30px}
        .logo{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;background:#3b82f6;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #60a5fa;box-shadow:0 0 15px rgba(96, 165, 250, 0.4)}
        .logo img{width:100%;height:100%;object-fit:cover}
        .status{display:inline-flex;align-items:center;gap:8px;background:rgba(22, 101, 52, 0.8);color:#bbf7d0;padding:6px 14px;border-radius:20px;font-size:14px;margin-bottom:15px;backdrop-filter: blur(4px)}
        .status-dot{width:10px;height:10px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
        h1{font-size:32px;color:#f8fafc;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
        .links{margin:15px 0;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
        .links a{color:#93c5fd;text-decoration:none;font-size:15px;transition: all 0.2s}
        .links a:hover{color:#bfdbfe;text-decoration:underline;text-shadow:0 0 8px rgba(147, 197, 253, 0.5)}
        .login-box{max-width:420px;margin:0 auto}
        .input-group{margin-bottom:18px}
        label{display:block;margin-bottom:6px;font-size:14px;color:#cbd5e1}
        input{width:100%;padding:13px;border-radius:10px;border:1px solid rgba(71, 85, 105, 0.6);background:rgba(15, 23, 42, 0.8);color:#f8fafc;font-size:15px;transition: border 0.2s}
        input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59, 130, 246, 0.2)}
        button{width:100%;padding:13px;background:linear-gradient(135deg, #2563eb, #1d4ed8);color:white;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(37, 99, 235, 0.3)}
        button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(37, 99, 235, 0.4)}
        button:disabled{background:#475569;cursor:not-allowed;transform:none}
        .btn-small{width:auto;padding:9px 14px;font-size:13px;margin:0 3px;border-radius:8px}
        .btn-danger{background:linear-gradient(135deg, #dc2626, #b91c1c);box-shadow:0 4px 12px rgba(220, 38, 38, 0.3)}
        .btn-danger:hover{box-shadow:0 6px 18px rgba(220, 38, 38, 0.4)}
        .btn-warning{background:linear-gradient(135deg, #d97706, #b45309);box-shadow:0 4px 12px rgba(217, 119, 6, 0.3)}
        .btn-warning:hover{box-shadow:0 6px 18px rgba(217, 119, 6, 0.4)}
        .btn-musik{position:fixed;top:20px;right:20px;width:auto;padding:8px 12px;font-size:14px;border-radius:20px;background:rgba(30, 41, 59, 0.9);backdrop-filter: blur(8px);z-index:999;box-shadow:0 4px 15px rgba(0,0,0,0.4)}
        .hidden{display:none!important}
        .section{margin:25px 0;padding:22px;background:rgba(15, 23, 42, 0.85);border-radius:14px;backdrop-filter: blur(4px);border:1px solid rgba(71, 85, 105, 0.4)}
        .section h3{margin-bottom:15px;color:#f1f5f9;font-size:19px;border-left:4px solid #3b82f6;padding-left:12px}
        .number-list{margin-top:10px;max-height:260px;overflow-y:auto;border-radius:10px}
        .number-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(51, 65, 85, 0.7);font-size:14px;transition:background 0.2s}
        .number-item:hover{background:rgba(30, 41, 59, 0.5)}
        .number-item:last-child{border-bottom:none}
        .msg{margin:12px 0;padding:11px;border-radius:10px;font-size:14px;text-align:center;backdrop-filter: blur(4px)}
        .msg.success{background:rgba(22, 101, 52, 0.8);color:#bbf7d0}
        .msg.error{background:rgba(153, 27, 27, 0.8);color:#fecaca}
        .loading{text-align:center;padding:15px;color:#94a3b8}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:rgba(15, 23, 42, 0.5)}
        ::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
    </style>
</head>
<body>
    <button class="btn-musik" id="tombolMusik" onclick="toggleMusik()">🔊 Musik: Hidup</button>
    <audio id="musikLatar" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    

<div class="container">
    <div class="header">
        <div class="logo"><img src="https://i.imgur.com/9ZbX7yY.png" alt="Logo"></div>
        <div class="status"><span class="status-dot"></span> Online (Sistem Aktif)</div>
        <h1>SlowRampas</h1>
        <div class="links">
            <a href="https://wa.me/601121292195" target="_blank">💬 Belum punya akun?</a>
            <a href="https://whatsapp.com/channel/0029VaNpXzF3Wk2aXz9w7L1b" target="_blank">📢 Saluran Owner</a>
        </div>
    </div>

    <div id="loginPage" class="login-box">
        <div class="input-group">
            <label>Masukkan Kata Sandi</label>
            <input type="password" id="passwordInput" placeholder="Masukkan sandi rahasia...">
        </div>
        <button onclick="login()">🔓 Masuk ke Panel Admin</button>
        <div id="loginMsg" class="msg hidden"></div>
    </div>

    <div id="panelPage" class="hidden">
        <div class="section">
            <h3>➕ Tambah Nomor Baru</h3>
            <div class="input-group">
                <label>Nomor WhatsApp (contoh: 601121292195)</label>
                <input type="text" id="newNumber" placeholder="Masukkan nomor tanpa spasi & tanda +">
            </div>
            <button onclick="tambahNomor()">✅ Tambah ke Database</button>
            <div id="addMsg" class="msg hidden"></div>
        </div>

        <div class="section">
            <h3>📋 Daftar Nomor Diizinkan</h3>
            <div id="loadingList" class="loading">⏳ Memuat data...</div>
            <div id="allowedList" class="number-list"></div>
        </div>

        <div id="adminFeatures" class="hidden">
            <div class="section">
                <h3>🗑️ Hapus Nomor</h3>
                <p style="font-size:13px;color:#94a3b8;margin-bottom:10px;">Klik tombol hapus di sebelah nomor</p>
            </div>
            <div class="section">
                <h3>🚫 Blokir Nomor</h3>
                <div class="input-group">
                    <label>Nomor yang akan diblokir</label>
                    <input type="text" id="blockNumber" placeholder="Masukkan nomor yang dilarang">
                </div>
                <button class="btn-warning" onclick="blokirNomor()">🚫 Blokir & Hapus Sekarang</button>
                <div id="blockMsg" class="msg hidden"></div>
            </div>
            <div class="section">
                <h3>⛔ Daftar Nomor Diblokir</h3>
                <div id="blockedList" class="number-list"></div>
            </div>
        </div>
        <button class="btn-small" style="margin-top:20px" onclick="keluar()">🚪 Keluar dari Panel</button>
    </div>
</div>

<script>
// ================== KONFIGURASI (TIDAK PERLU TOKEN DI SINI) ==================
const CONFIG = {
    gistId: "gist:15ac1842f1fdc462443d114df8c1d6e9"
    namaFileGist: "index.html.json",
    sandiUtama: "TuanSnowe890", // Ganti sandi penuh
    sandiBiasa: "Rampas123", // Ganti sandi hanya tambah
    ownerWa: "60182035439",
    channelWa: "https://whatsapp.com/channel/0029Vb890uOGk1Fq2TGrIw0s",
    linkLogo: "https://imgur.com/a/Ok4tN0F.jpg",
    linkLatarLuar: "https://l.top4top.io/p_3854axo680.jpg",
    linkLatarDalam: "https://x.xcute.workers.dev/f/images/080ef901e837.jpg",
    linkMusik: "https://imgur.com/a/RuFPIWk.mp3"
};
// =============================================================

let aksesLevel = null;
let daftarBlokir = [];
let dataAwal = null;
let shaGist = null;
const musik = document.getElementById("musikLatar");
musik.volume = 0.3;

function toggleMusik() {
    const tombol = document.getElementById("tombolMusik");
    if(musik.paused){
        musik.play().catch(()=>{});
        tombol.textContent = "🔊 Musik: Hidup";
    } else {
        musik.pause();
        tombol.textContent = "🔇 Musik: Mati";
    }
}

async function login() {
    const sandi = document.getElementById("passwordInput").value.trim();
    const pesan = document.getElementById("loginMsg");
    if(!sandi) return tampilPesan(pesan, "⚠️ Masukkan sandi dulu!", "error");
    if(sandi === CONFIG.sandiUtama){
        aksesLevel = "admin";
        bukaPanel();
    } else if(sandi === CONFIG.sandiBiasa){
        aksesLevel = "user";
        bukaPanel();
    } else {
        tampilPesan(pesan, "❌ Sandi salah!", "error");
    }
}

async function bukaPanel() {
    document.body.classList.add("panel-bg");
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("panelPage").classList.remove("hidden");
    if(aksesLevel === "admin") document.getElementById("adminFeatures").classList.remove("hidden");
    await muatData();
}

async function ambilDataGist() {
    const res = await fetch(`https://api.github.com/gists/${CONFIG.gistId}`);
    if(!res.ok) throw new Error("Gagal ambil data");
    const gist = await res.json();
    shaGist = gist.history[0].version;
    return JSON.parse(gist.files[CONFIG.namaFileGist].content);
}

async function simpanDataGist(dataBaru) {
    const res = await fetch(`https://api.github.com/gists/${CONFIG.gistId}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            files: { [CONFIG.namaFileGist]: { content: JSON.stringify(dataBaru, null, 4) } }
        })
    });
    if(!res.ok) throw new Error("Gagal simpan data");
    return await res.json();
}

async function muatData() {
    try {
        document.getElementById("loadingList").classList.remove("hidden");
        document.getElementById("allowedList").innerHTML = "";
        dataAwal = await ambilDataGist();
        const daftar = dataAwal.allowed_numbers || [];
        const listHtml = daftar.map(nomor => `
            <div class="number-item">
                <span>📞 ${nomor}</span>
                ${aksesLevel === "admin" ? `<button class="btn-small btn-danger" onclick="hapusNomor('${nomor}')">🗑️ Hapus</button>` : ""}
            </div>
        `).join("");
        document.getElementById("allowedList").innerHTML = listHtml || "<div style='padding:15px;text-align:center;color:#94a3b8'>Belum ada nomor</div>";
        document.getElementById("loadingList").classList.add("hidden");
    } catch (err) {
        document.getElementById("loadingList").innerHTML = `❌ Gagal: ${err.message}`;
    }
}

async function tambahNomor() {
    const nomor = document.getElementById("newNumber").value.trim().replace(/\D/g, "");
    const pesan = document.getElementById("addMsg");
    if(!nomor || nomor.length < 10) return tampilPesan(pesan, "⚠️ Nomor tidak valid!", "error");
    if(daftarBlokir.includes(nomor)) return tampilPesan(pesan, "🚫 Nomor sudah diblokir!", "error");
    try {
        if(dataAwal.allowed_numbers.includes(nomor)) return tampilPesan(pesan, "ℹ️ Sudah ada di daftar!", "error");
        dataAwal.allowed_numbers.push(nomor);
        await simpanDataGist(dataAwal);
        tampilPesan(pesan, "✅ Berhasil ditambahkan!", "success");
        document.getElementById("newNumber").value = "";
        muatData();
    } catch (err) {
        tampilPesan(pesan, "❌ Gagal: " + err.message, "error");
    }
}

async function hapusNomor(nomor) {
    if(aksesLevel !== "admin") return;
    if(!confirm(`Yakin hapus ${nomor}?`)) return;
    try {
        dataAwal.allowed_numbers = dataAwal.allowed_numbers.filter(n => n !== nomor);
        await simpanDataGist(dataAwal);
        muatData();
    } catch (err) {
        alert("❌ Gagal hapus: " + err.message);
    }
}

async function blokirNomor() {
    const nomor = document.getElementById("blockNumber").value.trim().replace(/\D/g, "");
    const pesan = document.getElementById("blockMsg");
    if(!nomor) return tampilPesan(pesan, "⚠️ Masukkan nomor!", "error");
    if(daftarBlokir.includes(nomor)) return tampilPesan(pesan, "ℹ️ Sudah diblokir!", "error");
    daftarBlokir.push(nomor);
    await hapusNomor(nomor);
    tampilPesan(pesan, "✅ Berhasil diblokir!", "success");
    document.getElementById("blockNumber").value = "";
    document.getElementById("blockedList").innerHTML += `<div class="number-item"><span>⛔ ${nomor}</span></div>`;
}

function tampilPesan(el, teks, jenis) {
    el.textContent = teks;
    el.className = `msg ${jenis}`;
    el.classList.remove("hidden");
    setTimeout(() => el.classList.add("hidden"), 5000);
}

function keluar() {
    aksesLevel = null;
    document.getElementById("passwordInput").value = "";
    document.getElementById("panelPage").classList.add("hidden");
    document.body.classList.remove("panel-bg");
    document.getElementById("loginPage").classList.remove("hidden");
}
</script>
</body>
  </html>
